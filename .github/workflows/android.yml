# Every successful branch run must produce a persistent-key-signed Release APK.
# [final-apk] Build the explicit custom dialog surface implementation.
# [final-apk] Include recurring payment dialogs in shared dialog system.
# [final-apk] Fix recurring dialog action slot and rebuild.
# Includes carryover accounting, partial-period forecasting, and payment reminder rescheduling.
# Includes regression coverage for Russian spoken thousand amounts.
name: Android APK

on:
  push:
    branches: [ "main", "feature/next-update-ux", "feature/charts-icon-ai-foundation-2026-11-19", "feature/assistant-intent-v1-2026-11-19", "feature/home-screen-widget-v1-2026-11-19", "feature/reliability-voice-analytics-v2-2026-11-19", "feature/widget-2x2-2026-11-19", "feature/major-update-1.1.0-1.2.0-2026-11-19", "feature/tbank-notification-import-2026-11-19", "feature/backup-cloud-retention-2026-11-20", "feature/next-update-voice-history-2026-11-20", "feature/fix-voice-dates-history-2026-11-20", "fix/voice-natural-phrases-date-field-2026-11-20", "feature/quarterly-allocation-recurring-payments-2026-11-20", "release/rustore-icon-1.3.16", "feature/assistant-financial-intelligence-1.3.17", "fix/manual-allocation-restore-2026-11-20", "fix/recurring-payments-add-button-2026-11-20", "feature/collapse-pending-payments-2026-11-20", "feature/recurring-payments-calendar-2026-11-20", "fix/responsive-layout-2026-11-20", "feature/reporting-period-settings-income-collapse-2026-11-22", "fix/restore-overview-controls-2026-11-22", "feature/reporting-period-budget-carryover-2026-11-24", "feature/dynamic-expense-history-analytics-2026-11-24", "fix/thunbudget-user-feedback-2026-11-25", "test/apk-dialog-nav-only-2026-11-25", "fix/unified-dialogs-all-screens-2026-11-25", "fix/dialog-design-only-2026-11-25", "feature/unified-light-dark-dialog-palette-2026-11-25", "fix/dialog-runtime-diagnostics-and-ui-tests-2026-11-25", "fix/compose-dialog-screenshot-test-603", "fix/global-dialog-field-palette-616", "restore/analytics-calculations-build-622", "feature/forecast-engine-v2", "feature/flexible-periods-analytics-2026-11-26", "feature/assistant-universal-queries-2026-11-27", "feature/balance-pro-visual-refresh-2026-11-27", "feature/cashflow-calendar-ledger-2026-11-27" ]
  workflow_dispatch:

concurrency:
  group: thunbudget-android-responsive-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Run unit tests
        run: gradle :app:testDebugUnitTest
      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ThunBudget-Analytics-unit-test-reports
          path: |
            app/build/test-results/testDebugUnitTest/**
            app/build/reports/tests/testDebugUnitTest/**
          if-no-files-found: warn
          retention-days: 7
      # Functional CI only: business-logic unit tests and signed Release APK verification.
      # Dialog/theme screenshot tests are intentionally not part of this workflow.
      - name: Require persistent release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.THUNBUDGET_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.THUNBUDGET_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.THUNBUDGET_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.THUNBUDGET_KEY_PASSWORD }}
        run: |
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::A signed Release APK was requested, but a required persistent signing secret is missing: $name"
              exit 1
            fi
          done
      - name: Decode persistent release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.THUNBUDGET_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.THUNBUDGET_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.THUNBUDGET_KEY_ALIAS }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/thunbudget-release.jks"
          test -s "$RUNNER_TEMP/thunbudget-release.jks"
          keytool -list -keystore "$RUNNER_TEMP/thunbudget-release.jks" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          test -s "$RUNNER_TEMP/thunbudget-release.jks"
          keytool -list -keystore "$RUNNER_TEMP/thunbudget-release.jks" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
      - name: Build signed release APK
        env:
          THUNBUDGET_KEYSTORE_FILE: ${{ runner.temp }}/thunbudget-release.jks
          THUNBUDGET_KEYSTORE_PASSWORD: ${{ secrets.THUNBUDGET_KEYSTORE_PASSWORD }}
          THUNBUDGET_KEY_ALIAS: ${{ secrets.THUNBUDGET_KEY_ALIAS }}
          THUNBUDGET_KEY_PASSWORD: ${{ secrets.THUNBUDGET_KEY_PASSWORD }}
        run: gradle :app:assembleRelease
      - name: Verify signed release APK
        run: |
          APK_PATH="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK_PATH"
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner -print | sort -V | tail -n 1)"
          if [ -z "$APKSIGNER" ]; then
            echo "::error::Android apksigner was not found in $SDK_ROOT/build-tools."
            exit 1
          fi
          VERIFY_OUTPUT="$("$APKSIGNER" verify --verbose --print-certs "$APK_PATH" 2>&1)"
          printf '%s\n' "$VERIFY_OUTPUT"
          EXPECTED_CERT_SHA256="f8ac7d059a0bf9bb974b36d55247f356284f3d8d455d591fae43ef6a3467c5c8"
          if ! printf '%s\n' "$VERIFY_OUTPUT" | grep -Fq "$EXPECTED_CERT_SHA256"; then
            echo "::error::APK signature does not match the established release certificate."
            exit 1
          fi
      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: ThunBudget-Analytics-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
# [final-apk] Trigger release build from the dialog design branch.
# [final-apk] Re-run after correcting the light-theme screenshot fixture to use a light Material background.

# [final-apk] Rebuild after forcing transparent dialog window background and explicit app theme propagation.

# [final-apk] Rebuild soft-violet mic action and selected navigation indicator.

# [final-apk] Match dark dialog graphite surface to user screenshot reference.

# [final-apk] Verify modal overlays inherit the selected light/dark app theme.

# [final-apk] Build and verify signed release after analytics calculation audit.
# Flexible periods: run unit tests, build signed Release APK and verify the established signing certificate.
