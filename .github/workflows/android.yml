name: Android APK

on:
  push:
    branches: [ "main", "feature/next-update-ux", "feature/charts-icon-ai-foundation-2026-11-19", "feature/assistant-intent-v1-2026-11-19", "feature/home-screen-widget-v1-2026-11-19", "feature/reliability-voice-analytics-v2-2026-11-19", "feature/widget-2x2-2026-11-19", "feature/major-update-1.1.0-1.2.0-2026-11-19", "feature/tbank-notification-import-2026-11-19", "feature/backup-cloud-retention-2026-11-20", "feature/next-update-voice-history-2026-11-20", "feature/fix-voice-dates-history-2026-11-20", "fix/voice-natural-phrases-date-field-2026-11-20", "feature/quarterly-allocation-recurring-payments-2026-11-20", "release/rustore-icon-1.3.16", "feature/assistant-financial-intelligence-1.3.17", "fix/manual-allocation-restore-2026-11-20", "fix/recurring-payments-add-button-2026-11-20", "feature/collapse-pending-payments-2026-11-20", "feature/recurring-payments-calendar-2026-11-20", "fix/responsive-layout-2026-11-20", "feature/reporting-period-settings-income-collapse-2026-11-22", "fix/restore-overview-controls-2026-11-22", "feature/tbank-smart-import-lab-1.3.25" ]
  workflow_dispatch:

concurrency:
  group: thunbudget-android-responsive-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      THUNBUDGET_SIGNING_KEY: ${{ secrets.THUNBUDGET_KEYSTORE_BASE64 }}
      ANDROID_I_WANT_MY_TCG: "yes"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Run JVM unit tests (no emulator required)
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Run Android instrumentation tests and build debug APK
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          emulator-boot-timeout: 1200
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot -camera-back none
          disable-animations: true
          script: |
            set -euo pipefail
            echo "=== ADB device state ==="
            adb devices -l
            adb wait-for-device
            for attempt in $(seq 1 120); do
              boot_completed="$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)"
              sdk="$(adb shell getprop ro.build.version.sdk 2>/dev/null | tr -d '\r' || true)"
              if [ "$boot_completed" = "1" ] && [ "$sdk" = "35" ]; then
                echo "Emulator ready: API $sdk"
                break
              fi
              if [ "$attempt" -eq 120 ]; then
                echo "Emulator did not become ready (boot=$boot_completed sdk=$sdk)"
                adb devices -l || true
                adb logcat -d -v threadtime > "$GITHUB_WORKSPACE/emulator-startup-logcat.txt" 2>&1 || true
                exit 1
              fi
              sleep 5
            done
            adb shell settings put global window_animation_scale 0
            adb shell settings put global transition_animation_scale 0
            adb shell settings put global animator_duration_scale 0
            adb logcat -c
            if ! gradle :app:connectedDebugAndroidTest --stacktrace --info; then
              adb logcat -d -v threadtime > "$GITHUB_WORKSPACE/instrumentation-logcat.txt" 2>&1 || true
              adb shell dumpsys activity activities > "$GITHUB_WORKSPACE/activity-state.txt" 2>&1 || true
              adb shell dumpsys meminfo > "$GITHUB_WORKSPACE/emulator-memory.txt" 2>&1 || true
              adb shell dumpsys package ru.scooblydoon.thunbudget.analytics > "$GITHUB_WORKSPACE/app-package-state.txt" 2>&1 || true
              adb devices -l > "$GITHUB_WORKSPACE/adb-devices.txt" 2>&1 || true
              exit 1
            fi
            gradle :app:assembleDebug --stacktrace

      - name: Upload emulator diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-diagnostics
          path: |
            emulator-startup-logcat.txt
            instrumentation-logcat.txt
            activity-state.txt
            emulator-memory.txt
            app-package-state.txt
            adb-devices.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Decode persistent release keystore
        if: ${{ (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[final-apk]')) && env.THUNBUDGET_SIGNING_KEY != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.THUNBUDGET_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/thunbudget-release.jks"

      - name: Build signed release APK
        id: signed_release
        continue-on-error: true
        if: ${{ (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[final-apk]')) && env.THUNBUDGET_SIGNING_KEY != '' }}
        env:
          THUNBUDGET_KEYSTORE_FILE: ${{ runner.temp }}/thunbudget-release.jks
          THUNBUDGET_KEYSTORE_PASSWORD: ${{ secrets.THUNBUDGET_KEYSTORE_PASSWORD }}
          THUNBUDGET_KEY_ALIAS: ${{ secrets.THUNBUDGET_KEY_ALIAS }}
          THUNBUDGET_KEY_PASSWORD: ${{ secrets.THUNBUDGET_KEY_PASSWORD }}
        run: gradle :app:assembleRelease

      - name: Upload signed release APK
        if: ${{ (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[final-apk]')) && env.THUNBUDGET_SIGNING_KEY != '' && steps.signed_release.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: ThunBudget-Analytics-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Build debug APK (temporary, not suitable for upgrades)
        if: ${{ always() && ((github.event_name != 'workflow_dispatch' && !contains(github.event.head_commit.message, '[final-apk]')) || env.THUNBUDGET_SIGNING_KEY == '' || steps.signed_release.outcome == 'failure') }}
        run: gradle :app:assembleDebug

      - name: Upload debug APK
        if: ${{ always() && ((github.event_name != 'workflow_dispatch' && !contains(github.event.head_commit.message, '[final-apk]')) || env.THUNBUDGET_SIGNING_KEY == '' || steps.signed_release.outcome == 'failure') }}
        uses: actions/upload-artifact@v4
        with:
          name: ThunBudget-Analytics-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
