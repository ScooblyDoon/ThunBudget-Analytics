name: Android APK

on:
  push:
    branches: [ "main", "feature/next-update-ux", "feature/charts-icon-ai-foundation-2026-11-19", "feature/assistant-intent-v1-2026-11-19", "feature/home-screen-widget-v1-2026-11-19", "feature/reliability-voice-analytics-v2-2026-11-19", "feature/widget-2x2-2026-11-19", "feature/major-update-1.1.0-1.2.0-2026-11-19", "feature/tbank-notification-import-2026-11-19", "feature/backup-cloud-retention-2026-11-20", "feature/next-update-voice-history-2026-11-20", "feature/fix-voice-dates-history-2026-11-20", "fix/voice-natural-phrases-date-field-2026-11-20", "feature/quarterly-allocation-recurring-payments-2026-11-20", "release/rustore-icon-1.3.16", "feature/assistant-financial-intelligence-1.3.17", "fix/manual-allocation-restore-2026-11-20", "fix/recurring-payments-add-button-2026-11-20", "feature/collapse-pending-payments-2026-11-20", "feature/recurring-payments-calendar-2026-11-20", "fix/responsive-layout-2026-11-20", "feature/reporting-period-settings-income-collapse-2026-11-22", "fix/restore-overview-controls-2026-11-22", "feature/reporting-period-budget-carryover-2026-11-24", "feature/dynamic-expense-history-analytics-2026-11-24", "fix/thunbudget-user-feedback-2026-11-25", "test/apk-dialog-nav-only-2026-11-25", "fix/unified-dialogs-all-screens-2026-11-25", "fix/dialog-design-only-2026-11-25", "feature/unified-light-dark-dialog-palette-2026-11-25" ]
  workflow_dispatch:

concurrency:
  group: thunbudget-android-responsive-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      THUNBUDGET_SIGNING_KEY: ${{ secrets.THUNBUDGET_KEYSTORE_BASE64 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Run unit tests and compile debug APK
        run: gradle :app:testDebugUnitTest :app:assembleDebug
      - name: Run Compose dialog screenshot tests on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: gradle :app:connectedDebugAndroidTest
      - name: Decode persistent release keystore
        if: ${{ (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[final-apk]')) && env.THUNBUDGET_SIGNING_KEY != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.THUNBUDGET_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/thunbudget-release.jks"
      - name: Build signed release APK
        id: signed_release
        continue-on-error: true
        if: ${{ (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[final-apk]')) && env.THUNBUDGET_SIGNING_KEY != '' }}
        env:
          THUNBUDGET_KEYSTORE_FILE: ${{ runner.temp }}/thunbudget-release.jks
          THUNBUDGET_KEYSTORE_PASSWORD: ${{ secrets.THUNBUDGET_KEYSTORE_PASSWORD }}
          THUNBUDGET_KEY_ALIAS: ${{ secrets.THUNBUDGET_KEY_ALIAS }}
          THUNBUDGET_KEY_PASSWORD: ${{ secrets.THUNBUDGET_KEY_PASSWORD }}
        run: gradle :app:assembleRelease
      - name: Upload signed release APK
        if: ${{ (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[final-apk]')) && env.THUNBUDGET_SIGNING_KEY != '' && steps.signed_release.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: ThunBudget-Analytics-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
      - name: Build debug APK (temporary, not suitable for upgrades)
        if: ${{ !cancelled() && ((github.event_name != 'workflow_dispatch' && !contains(github.event.head_commit.message, '[final-apk]')) || env.THUNBUDGET_SIGNING_KEY == '' || steps.signed_release.outcome == 'failure') }}
        run: gradle :app:assembleDebug
      - name: Upload debug APK
        if: ${{ !cancelled() && ((github.event_name != 'workflow_dispatch' && !contains(github.event.head_commit.message, '[final-apk]')) || env.THUNBUDGET_SIGNING_KEY == '' || steps.signed_release.outcome == 'failure') }}
        uses: actions/upload-artifact@v4
        with:
          name: ThunBudget-Analytics-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

