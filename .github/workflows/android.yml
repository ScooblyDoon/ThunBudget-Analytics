name: Android APK and BrowserStack

on:
  push:
    branches:
      - main
      - feature/next-update-ux
      - feature/charts-icon-ai-foundation-2026-11-19
      - feature/assistant-intent-v1-2026-11-19
      - feature/home-screen-widget-v1-2026-11-19
      - feature/reliability-voice-analytics-v2-2026-11-19
      - feature/widget-2x2-2026-11-19
      - feature/major-update-1.1.0-1.2.0-2026-11-19
      - feature/tbank-notification-import-2026-11-19
      - feature/backup-cloud-retention-2026-11-20
      - feature/next-update-voice-history-2026-11-20
      - feature/fix-voice-dates-history-2026-11-20
      - fix/voice-natural-phrases-date-field-2026-11-20
      - feature/quarterly-allocation-recurring-payments-2026-11-20
      - release/rustore-icon-1.3.16
      - feature/assistant-financial-intelligence-1.3.17
      - fix/manual-allocation-restore-2026-11-20
      - fix/recurring-payments-add-button-2026-11-20
      - feature/collapse-pending-payments-2026-11-20
      - feature/recurring-payments-calendar-2026-11-20
      - fix/responsive-layout-2026-11-20
      - ci/android-testlab-integration
      - fix/browserstack-422-release-apk-2026-11-21
  workflow_dispatch:
    inputs:
      run_browserstack:
        description: "Run real-device BrowserStack Espresso tests"
        required: true
        type: boolean
        default: true

concurrency:
  group: thunbudget-android-responsive-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      THUNBUDGET_SIGNING_KEY: ${{ secrets.THUNBUDGET_KEYSTORE_BASE64 }}
      BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
      BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Run unit tests and build debug app plus Espresso test APK
        run: gradle :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Decode persistent release keystore
        if: ${{ (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[final-apk]')) && env.THUNBUDGET_SIGNING_KEY != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.THUNBUDGET_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/thunbudget-release.jks"
      - name: Build signed release APK
        id: signed_release
        continue-on-error: true
        if: ${{ (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[final-apk]')) && env.THUNBUDGET_SIGNING_KEY != '' }}
        env:
          THUNBUDGET_KEYSTORE_FILE: ${{ runner.temp }}/thunbudget-release.jks
          THUNBUDGET_KEYSTORE_PASSWORD: ${{ secrets.THUNBUDGET_KEYSTORE_PASSWORD }}
          THUNBUDGET_KEY_ALIAS: ${{ secrets.THUNBUDGET_KEY_ALIAS }}
          THUNBUDGET_KEY_PASSWORD: ${{ secrets.THUNBUDGET_KEY_PASSWORD }}
        run: gradle :app:assembleRelease
      - name: Upload signed release APK
        if: ${{ (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[final-apk]')) && env.THUNBUDGET_SIGNING_KEY != '' && steps.signed_release.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: ThunBudget-Analytics-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload debug and Espresso APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ThunBudget-Android-test-build
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload app and Espresso suite to BrowserStack
        if: ${{ (github.event_name == 'push' || inputs.run_browserstack) && env.BROWSERSTACK_USERNAME != '' && env.BROWSERSTACK_ACCESS_KEY != '' }}
        id: browserstack_upload
        run: |
          set -euo pipefail
          APP_RESPONSE=$(curl --fail --silent --show-error -u "$BROWSERSTACK_USERNAME:$BROWSERSTACK_ACCESS_KEY" \
            -X POST "https://api-cloud.browserstack.com/app-automate/espresso/v2/app" \
            -F "file=@app/build/outputs/apk/debug/app-debug.apk" \
            -F "custom_id=ThunBudget-Analytics")
          TEST_RESPONSE=$(curl --fail --silent --show-error -u "$BROWSERSTACK_USERNAME:$BROWSERSTACK_ACCESS_KEY" \
            -X POST "https://api-cloud.browserstack.com/app-automate/espresso/v2/test-suite" \
            -F "file=@app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk" \
            -F "custom_id=ThunBudget-Analytics-Espresso")
          APP_URL=$(echo "$APP_RESPONSE" | jq -r '.app_url // empty')
          TEST_URL=$(echo "$TEST_RESPONSE" | jq -r '.test_suite_url // empty')
          test -n "$APP_URL"
          test -n "$TEST_URL"
          echo "app_url=$APP_URL" >> "$GITHUB_OUTPUT"
          echo "test_url=$TEST_URL" >> "$GITHUB_OUTPUT"
          echo "Uploaded app and Espresso test APK to BrowserStack."

      - name: Discover all BrowserStack Android devices from Android 8 to 16
        if: ${{ steps.browserstack_upload.outcome == 'success' }}
        id: browserstack_devices
        run: |
          set -euo pipefail
          HTTP_STATUS=$(curl --silent --show-error -u "$BROWSERSTACK_USERNAME:$BROWSERSTACK_ACCESS_KEY" \
            -o browserstack-devices.json -w "%{http_code}" \
            "https://api-cloud.browserstack.com/app-automate/devices.json")
          if [[ "$HTTP_STATUS" -lt 200 || "$HTTP_STATUS" -ge 300 ]]; then
            echo "BrowserStack device catalog request failed (HTTP $HTTP_STATUS):"
            cat browserstack-devices.json
            exit 1
          fi
          mapfile -t DEVICE_LIST < <(jq -r '
            .[]
            | select(.os == "android")
            | select((.os_version | split(".")[0] | tonumber) >= 8 and (.os_version | split(".")[0] | tonumber) <= 16)
            | "\(.device)-\(.os_version)"
          ' browserstack-devices.json | sort -u)
          if [[ "${#DEVICE_LIST[@]}" -eq 0 ]]; then
            echo "No BrowserStack Android devices found for Android 8–16."
            exit 1
          fi
          printf '%s\n' "${DEVICE_LIST[@]}" > browserstack-selected-devices.txt
          echo "device_count=${#DEVICE_LIST[@]}" >> "$GITHUB_OUTPUT"
          echo "Discovered ${#DEVICE_LIST[@]} Android device/OS combinations:"
          printf '%s\n' "${DEVICE_LIST[@]}"

      - name: Run Espresso compatibility suite sequentially on all discovered Android 8–16 devices
        if: ${{ steps.browserstack_devices.outcome == 'success' }}
        id: browserstack_run
        timeout-minutes: 350
        env:
          APP_URL: ${{ steps.browserstack_upload.outputs.app_url }}
          TEST_URL: ${{ steps.browserstack_upload.outputs.test_url }}
        run: |
          set -euo pipefail
          RESULTS_FILE="browserstack-results.tsv"
          printf 'device\tbuild_id\tstatus\tduration_seconds\n' > "$RESULTS_FILE"
          PASSED=0
          FAILED=0
          TOTAL=0

          while IFS= read -r DEVICE; do
            [[ -n "$DEVICE" ]] || continue
            TOTAL=$((TOTAL + 1))
            echo "::group::BrowserStack device $TOTAL: $DEVICE"
            PAYLOAD=$(jq -n --arg app "$APP_URL" --arg suite "$TEST_URL" --arg device "$DEVICE" '{
              app: $app,
              testSuite: $suite,
              project: "ThunBudget Analytics Android 8-16 compatibility",
              devices: [$device]
            }')

            BUILD_ID=""
            for ATTEMPT in $(seq 1 60); do
              HTTP_STATUS=$(curl --silent --show-error -u "$BROWSERSTACK_USERNAME:$BROWSERSTACK_ACCESS_KEY" \
                -o browserstack-response.json -w "%{http_code}" \
                -X POST "https://api-cloud.browserstack.com/app-automate/espresso/v2/build" \
                -H "Content-Type: application/json" -d "$PAYLOAD")
              RESPONSE=$(cat browserstack-response.json)
              if [[ "$HTTP_STATUS" -ge 200 && "$HTTP_STATUS" -lt 300 ]]; then
                BUILD_ID=$(echo "$RESPONSE" | jq -r '.build_id // empty')
                if [[ -n "$BUILD_ID" ]]; then
                  break
                fi
                echo "BrowserStack returned success without build_id: $RESPONSE"
              elif [[ "$RESPONSE" == *"BROWSERSTACK_ALL_PARALLELS_IN_USE"* ]]; then
                echo "All BrowserStack parallel slots are occupied (attempt $ATTEMPT/60). Waiting 60 seconds."
                sleep 60
              else
                echo "BrowserStack rejected $DEVICE (HTTP $HTTP_STATUS): $RESPONSE"
                break
              fi
            done

            if [[ -z "$BUILD_ID" ]]; then
              echo "Could not start a BrowserStack build for $DEVICE."
              printf '%s\t%s\t%s\t%s\n' "$DEVICE" "-" "submission_failed" "0" >> "$RESULTS_FILE"
              FAILED=$((FAILED + 1))
              echo "::endgroup::"
              continue
            fi

            echo "Started BrowserStack build $BUILD_ID for $DEVICE"
            START_EPOCH=$(date +%s)
            FINAL_STATUS=""
            for POLL in $(seq 1 120); do
              STATUS_HTTP=$(curl --silent --show-error -u "$BROWSERSTACK_USERNAME:$BROWSERSTACK_ACCESS_KEY" \
                -o browserstack-status.json -w "%{http_code}" \
                "https://api-cloud.browserstack.com/app-automate/espresso/v2/builds/$BUILD_ID")
              if [[ "$STATUS_HTTP" -ge 200 && "$STATUS_HTTP" -lt 300 ]]; then
                CURRENT_STATUS=$(jq -r '.status // empty' browserstack-status.json)
                echo "Build $BUILD_ID status: ${CURRENT_STATUS:-unknown} (poll $POLL/120)"
                case "$CURRENT_STATUS" in
                  running|queued|pending|initializing|started|in_progress|"")
                    sleep 30
                    ;;
                  *)
                    FINAL_STATUS="$CURRENT_STATUS"
                    break
                    ;;
                esac
              else
                echo "Could not read build status (HTTP $STATUS_HTTP); retrying."
                sleep 30
              fi
            done

            DURATION=$(( $(date +%s) - START_EPOCH ))
            if [[ -z "$FINAL_STATUS" ]]; then
              FINAL_STATUS="poll_timeout"
            fi
            printf '%s\t%s\t%s\t%s\n' "$DEVICE" "$BUILD_ID" "$FINAL_STATUS" "$DURATION" >> "$RESULTS_FILE"
            if [[ "$FINAL_STATUS" == "passed" || "$FINAL_STATUS" == "success" ]]; then
              PASSED=$((PASSED + 1))
            else
              FAILED=$((FAILED + 1))
            fi
            echo "Finished $DEVICE: $FINAL_STATUS (${DURATION}s)"
            echo "::endgroup::"
          done < browserstack-selected-devices.txt

          echo "BrowserStack device compatibility summary: total=$TOTAL passed=$PASSED failed=$FAILED"
          {
            echo "### BrowserStack Android 8–16 compatibility"
            echo "- Device/OS combinations: $TOTAL"
            echo "- Passed: $PASSED"
            echo "- Failed or timed out: $FAILED"
            echo ""
            echo "| Device | Build ID | Status | Duration (s) |"
            echo "|---|---|---:|---:|"
            awk -F '\\t' 'NR>1 {printf "| %s | %s | %s | %s |\\n", $1, $2, $3, $4}' "$RESULTS_FILE"
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$FAILED" -gt 0 ]]; then
            exit 1
          fi

      - name: Upload BrowserStack compatibility results
        if: ${{ always() && steps.browserstack_devices.outcome == 'success' && hashFiles('browserstack-results.tsv') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: ThunBudget-BrowserStack-Android-8-16-results
          path: browserstack-results.tsv
          if-no-files-found: warn
          retention-days: 14

      - name: BrowserStack credentials not configured
        if: ${{ (github.event_name == 'push' || inputs.run_browserstack) && (env.BROWSERSTACK_USERNAME == '' || env.BROWSERSTACK_ACCESS_KEY == '') }}
        run: echo "BrowserStack run skipped because repository credentials are missing."
